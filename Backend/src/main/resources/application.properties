spring.application.name=AI_RESUME_BUILDER

# Database Configuration (PostgreSQL / Heroku Postgres with local H2 fallback)
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:airesumedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:sa}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.database-platform=${JDBC_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway Migrations (Enabled in Production when PostgreSQL credentials are provided)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration (Heroku Redis / Local in-memory fallback)
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Clerk Authentication Settings
clerk.issuer-uri=${CLERK_ISSUER_URI:https://clerk.example.com}
clerk.jwks-uri=${CLERK_JWKS_URI:https://clerk.example.com/.well-known/jwks.json}

# AI Provider Configurations
ai.provider.primary=gemini
ai.provider.fallback-chain=groq,openrouter,cohere,huggingface

# Individual AI Keys & Endpoints
ai.gemini.key=${GEMINI_API_KEY:}
ai.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}

ai.groq.key=${GROQ_API_KEY:}
ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}

ai.openrouter.key=${OPENROUTER_API_KEY:}
ai.openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}

ai.cohere.key=${COHERE_API_KEY:}
ai.cohere.url=${COHERE_URL:https://api.cohere.com/v1/chat}

ai.huggingface.key=${HF_API_KEY:}
ai.huggingface.url=${HF_URL:https://api-inference.huggingface.co/models/}

# Server & CORS
server.port=${PORT:8080}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Structured Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [reqId=%X{requestId} userId=%X{userId}] - %msg%n
logging.level.org.example.ai_resume_builder=INFO